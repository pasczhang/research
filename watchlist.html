<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自选股 | 个人投资研究系统</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qt.gtimg.cn">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M6 22 L12 14 L17 18 L26 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="8" r="2" fill="#c9a227"/></svg>
        </span>
        <span>个人投资研究系统</span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-label="打开菜单" aria-expanded="false">菜单</button>
      <nav>
        <a href="index.html">首页</a>
        <a href="market.html">市场看板</a>
        <a href="limit.html">涨停板分析</a>
        <a class="active" href="watchlist.html">自选股</a>
        <a href="research.html">研究报告</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <h1>自选股</h1>
        <p>持仓与关注分组保存在浏览器本地。填写成本价与数量后，可跟踪盈亏比例。</p>
      </div>
      <div class="meta-chip">
        <div class="meta-actions">
          <div class="status"><span class="status-dot"></span><span data-updated>本地列表</span></div>
          <button type="button" data-refresh>刷新</button>
        </div>
        <div data-clock></div>
      </div>
    </section>

    <div class="banner" data-banner hidden></div>

    <section class="panel">
      <div class="panel-head">
        <h2>我的标的</h2>
        <div class="toolbar">
          <div class="filter-bar" data-filter>
            <button type="button" class="ghost active" data-filter-value="all">全部</button>
            <button type="button" class="ghost" data-filter-value="hold">持仓</button>
            <button type="button" class="ghost" data-filter-value="watch">关注</button>
          </div>
          <form class="toolbar" data-watch-form>
            <input data-code name="code" placeholder="代码，如 600519 / 00700 / AAPL" autocomplete="off">
            <select data-group aria-label="分组">
              <option value="watch">关注</option>
              <option value="hold">持仓</option>
            </select>
            <button type="submit">添加</button>
          </form>
          <div class="export-bar">
            <button type="button" class="ghost" data-export="csv">导出 CSV</button>
            <button type="button" class="ghost" data-export="json">导出 JSON</button>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="responsive">
          <thead>
            <tr>
              <th>名称</th>
              <th>代码</th>
              <th class="num">最新</th>
              <th class="num">涨跌幅</th>
              <th class="num">成本价</th>
              <th class="num">数量</th>
              <th class="num">盈亏比例</th>
              <th class="num">操作</th>
            </tr>
          </thead>
          <tbody data-watchlist>
            <tr><td colspan="8" class="empty">正在加载...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner"><strong>风险提示：</strong>投资有风险，决策需谨慎。盈亏为估算值，未计税费与滑点。</div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/watchlist.js"></script>
</body>
</html>
