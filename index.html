<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M6 22 L12 14 L17 18 L26 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="8" r="2" fill="#c9a227"/></svg>
        </span>
        <span>个人投资研究系统</span>
      </a>
      <nav>
        <a class="active" href="index.html">首页</a>
        <a href="market.html">市场看板</a>
        <a href="watchlist.html">自选股</a>
        <a href="research.html">研究报告</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <h1>市场概览</h1>
        <p>跟踪核心基准指数，辅助独立研究与仓位决策。</p>
      </div>
      <div class="meta-chip">
        <div class="status"><span class="status-dot"></span><span data-updated>等待行情</span></div>
        <div data-clock></div>
      </div>
    </section>

    <section class="cards" aria-label="实时指数">
      <article class="card" data-index="csi300">
        <div class="card-head"><div class="card-name">沪深300</div><div class="market-tag">CN</div></div>
        <div class="skeleton"></div>
      </article>
      <article class="card" data-index="hsi">
        <div class="card-head"><div class="card-name">恒生指数</div><div class="market-tag">HK</div></div>
        <div class="skeleton"></div>
      </article>
      <article class="card" data-index="spx">
        <div class="card-head"><div class="card-name">标普500</div><div class="market-tag">US</div></div>
        <div class="skeleton"></div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner"><strong>风险提示：</strong>投资有风险，决策需谨慎</div>
  </footer>
