        <span class="tag">宏观</span>
        <h3>三市场流动性对照</h3>
        <p>比较内地、香港与美国基准指数的波动节奏，用于判断风险偏好是同步扩散还是区域分化。</p>
      </article>
      <article class="report">
        <span class="tag">仓位</span>
        <h3>回撤纪律检查清单</h3>
        <p>从最大回撤、持仓集中度和现金比例三项指标，定期复核组合是否偏离预设风险预算。</p>
      </article>
      <article class="report">
        <span class="tag">方法</span>
        <h3>指数锚点研究法</h3>
        <p>先看沪深300、恒生指数、标普500的相对强弱，再下钻到行业与个股，避免孤立解读单一标的。</p>
      </article>
